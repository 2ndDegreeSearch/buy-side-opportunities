name: Update or remove a firm
description: Report a new or closed role, wrong AUM, a dead link or a firm that no longer fits
title: "Update: "
labels: ["update"]
body:
  - type: input
    id: firm
    attributes:
      label: Firm name
      description: As it appears on the board.
    validations:
      required: true
  - type: dropdown
    id: change
    attributes:
      label: What changed?
      options:
        - A role opened
        - A role closed
        - AUM or strategy is wrong
        - Contact or link is wrong
        - Remove this firm
        - Other
    validations:
      required: true
  - type: markdown
    attributes:
      value: For a role or contact change, fill in the new values below. Leave them blank otherwise.
  - type: dropdown
    id: posting
    attributes:
      label: Is a specific role open now?
      description: N/A means this update is not about a role, and is treated the same as No.
      options:
        - "N/A"
        - "No"
        - "Yes"
      default: 0
    validations:
      required: true
  - type: input
    id: careers
    attributes:
      label: Role title, or careers / contact
      description: >-
        If a role is open, its title, optionally with where it is posted.
        Otherwise, where the firm lists jobs or a public contact.
      placeholder: "e.g. Credit Analyst (Lever)  /  Greenhouse job board  /  Tel 212-555-0100"
  - type: input
    id: link
    attributes:
      label: Link
      description: The posting, careers page or firm website, or a public email address.
      placeholder: "e.g. https://jobs.lever.co/example/1234"
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Anything else, such as the correct AUM with a source, or why the firm should be removed.
