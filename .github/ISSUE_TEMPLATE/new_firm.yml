name: Add a firm
description: Suggest a buy-side firm for the board
title: "New firm: "
labels: ["new firm"]
body:
  - type: input
    id: firm
    attributes:
      label: Firm name
      placeholder: Varadero Capital
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Private Credit & Asset-Based Finance
        - BDCs & Venture Debt
        - Hedge Funds
        - Litigation Finance & Insurance-Linked Securities
        - Emerging Managers
    validations:
      required: true
  - type: input
    id: strategy
    attributes:
      label: Strategy
      placeholder: ABF / structured credit
    validations:
      required: true
  - type: input
    id: hq
    attributes:
      label: Headquarters
      placeholder: New York
    validations:
      required: true
  - type: input
    id: aum
    attributes:
      label: AUM and source
      description: Include where the figure comes from (Form ADV, 13F, press release, ...).
      placeholder: $2.3B (Form ADV, 2026)
  - type: dropdown
    id: posting
    attributes:
      label: Is a specific role open?
      options:
        - "Yes"
        - "No"
    validations:
      required: true
  - type: input
    id: careers
    attributes:
      label: Role title, or careers / contact
      description: >-
        If a role is open, its title, optionally with where it is posted.
        Otherwise, where the firm lists jobs or a public contact.
      placeholder: "Credit Analyst (Lever)  /  Greenhouse job board  /  Tel 212-555-0100"
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Link
      description: The posting, careers page or firm website, or a public email address.
      placeholder: https://jobs.lever.co/example/1234

