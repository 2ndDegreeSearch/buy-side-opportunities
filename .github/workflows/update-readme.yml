name: Update README

# Regenerates README.md from firms.csv so the board never drifts from its data.
on:
  push:
    branches: [main]
    paths:
      - firms.csv
      - .github/scripts/build_board.py
      - .github/workflows/update-readme.yml
  pull_request:
    paths:
      - firms.csv
      - .github/scripts/build_board.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # On pull requests this only checks that firms.csv parses and renders.
      - name: Render README
        run: python3 .github/scripts/build_board.py

      - name: Commit README
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet README.md; then
            echo "README.md is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Regenerate README from firms.csv"
          git push
